#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 90% at 50% 110%,#f0894c33,transparent 60%),linear-gradient(#0e1a26,#0a1016);transition:opacity .9s ease}

#loader .msg{color:var(--ink-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* =====================================================================

  if (k.has('d')) camera.position.addScaledVector(r, sp); if (k.has('a')) camera.position.addScaledVector(r, -sp);
  if (k.has(' ')) camera.position.y += sp; if (k.has('q')) camera.position.y -= sp;
  const g = groundAt(camera.position.x, camera.position.z) + 0.25; if (camera.position.y < g) camera.position.y = g;
}
canvas.addEventListener('pointerdown', e => { input.dragging = true; input.lx = e.clientX; input.ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!input.dragging) return;
  const dx = e.clientX - input.lx, dy = e.clientY - input.ly; input.lx = e.clientX; input.ly = e.clientY;
  input.yaw -= dx * 0.0035; input.pitch = clamp(input.pitch - dy * 0.0035, -1.5, 1.5);
});
canvas.addEventListener('pointerup', () => { input.dragging = false; });
canvas.addEventListener('wheel', e => { input.speed = clamp(input.speed * (e.deltaY > 0 ? 0.87 : 1.15), 0.5, 80); }, { passive: true });
addEventListener('keydown', e => { input.keys.add(e.key.toLowerCase()); });
addEventListener('keyup', e => { input.keys.delete(e.key.toLowerCase()); });

/* =====================================================================
   12. GUI, QUALITY, MAIN LOOP
   ===================================================================== */
const LM = (...ls) => ls.reduce((m, l) => m | (1 << l), 0);
const MASK_REFL = LM(0, L_ABOVE, L_BOTH, L_SKY);
const MASK_REFR_ABOVE = LM(0, L_UNDER, L_BOTH), MASK_REFR_UNDER = LM(0, L_ABOVE, L_BOTH, L_SKY);
const MASK_MAIN_ABOVE = LM(0, L_ABOVE, L_BOTH, L_SKY, L_SURFACE, L_WATER), MASK_MAIN_UNDER = LM(0, L_UNDER, L_BOTH, L_SURFACE, L_WATER);
shadowRefreshCam.layers.disable(L_WATER);
let frameNo = 0;
const stats = { fps: 60, ms: 16, acc: 0, n: 0, t0: performance.now() };
// profiling: COVE.profile() times each pass with a GPU sync (debug only)
const prof = { on: false, t: {}, mark(name, fn) { if (!this.on) return fn(); gl.finish(); const t0 = performance.now(); fn(); gl.finish(); this.t[name] = (this.t[name] || 0) + performance.now() - t0; } };
function renderFrame() {
  const under = GU.uCamUnder.value > 0.5;
  renderer.setClearColor(0x000000, 1);
  if (frameNo % 2 === 0 || prof.on) prof.mark('shadow', () => {
    renderer.shadowMap.needsUpdate = true; renderer.setRenderTarget(dummyRT); renderer.render(scene, shadowRefreshCam);
  });
  if (sun.shadow.map) { WU.tShadow.value = sun.shadow.map.texture; WU.uShadowMat.value.copy(sun.shadow.matrix); WU.uShadowOn.value = 1; }
  WU.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  if (!under) prof.mark('reflection', () => {
    updateMirror(); mirrorCam.layers.mask = MASK_REFL;
    renderer.clippingPlanes = [reflClip]; renderer.setRenderTarget(RT.refl); renderer.clear(); renderer.render(scene, mirrorCam); renderer.clippingPlanes = [];
  });
  prof.mark('refraction', () => {
    camera.layers.mask = under ? MASK_REFR_UNDER : MASK_REFR_ABOVE;
    renderer.setRenderTarget(RT.refr); renderer.clear(); renderer.render(scene, camera);
  });
  prof.mark('main', () => {
    camera.layers.mask = under ? MASK_MAIN_UNDER : MASK_MAIN_ABOVE;
    renderer.setRenderTarget(RT.main); renderer.clear(); renderer.render(scene, camera);
  });
  prof.mark('post', () => runPost());
}
function profile(frames = 20) {
  prof.on = true; prof.t = {};
  for (let i = 0; i < frames; i++) { renderFrame(); }
  prof.on = false;
  const out = {}; let tot = 0; for (const k in prof.t) { out[k] = +(prof.t[k] / frames).toFixed(2); tot += prof.t[k] / frames; } out.total = +tot.toFixed(2);
  return out;
}

// ---------------------------------------------------------------- build the world
await progress(0.05, 'Painting textures');
buildBaseTextures(); GU.tCaustics.value = TX.caustics; GU.tNoise.value = TX.noise;
await progress(0.14, 'Tracing the cove');
buildSDF();
await progress(0.26, 'Shaping the sand');
for (let j = 0; j < HN; j++) for (let i = 0; i < HN; i++) HGT[j * HN + i] = terrainH(DOM.x0 + i / (HN - 1) * DOM.size, DOM.z0 + j / (HN - 1) * DOM.size);
makeMaskTextures();
buildTerrain();
await progress(0.4, 'Filling the bay');
buildWater(); buildSims(); makeTargets();
await progress(0.5, 'Raising the cliffs');
buildMaterials(); buildCliffs(); buildRocks(); buildTidePools();
await progress(0.6, 'Building the boardwalk');
buildBoardwalk(); buildPier(); buildBoat(); buildCabana(); buildLifeguard(); buildIslands();
/* @@BUILD@@ */
await progress(0.95, 'Warming up shaders');
updateSun(); updateWaves(); bakeEnv(true);
setCam([-38, 9, 60], [5, 0, 0]);
renderer.compile(scene, camera);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); makeTargets(); });

const clock = new THREE.Clock();
let worldTime = 0;
function tick() {
  requestAnimationFrame(tick);
  frameStep(Math.min(clock.getDelta(), 0.05));
}
// advance the world by a fixed step (also used by tests: COVE.advance)
function frameStep(rdt, draw = true) {
  const dt = P.freeze ? 0 : rdt;
  worldTime += dt; GU.uTime.value = worldTime;
  // tide
  GU.uTide.value = Math.sin(worldTime / (P.tidePeriod * 60) * TAU);
  GU.uWaterY.value = GU.uTide.value * P.tideRange * 0.5; GU.uHighTide.value = P.tideRange;
  ENV.tod = P.tod;
  updateSun(); updateWaves();
  if (frameNo % 30 === 0) bakeEnv(false);
  GU.uWindDir.value.set(Math.sin(P.windDir * DEG), Math.cos(P.windDir * DEG)); GU.uWind.value = ENV.wind;
  GU.uGust.value = ENV.wind * (0.5 + 0.5 * Math.sin(worldTime * 0.37) * Math.sin(worldTime * 0.23 + 1)) * 0.8;
  updateWaterLook();
  updateManual(rdt);
  camera.updateMatrixWorld();
  const wh = waterHeightAt(camera.position.x, camera.position.z);
  GU.uCamUnder.value = camera.position.y < wh - 0.02 ? 1 : 0;
  updatePools(); updateBoat(Math.max(dt, 1e-3), worldTime);
  /* @@UPDATE@@ */
  stepSims(dt);
  if (draw) renderFrame();
  frameNo++;
  const now = performance.now(); stats.acc += rdt; stats.n++;
  if (now - stats.t0 > 500) { stats.fps = stats.n / ((now - stats.t0) / 1000); stats.ms = 1000 / stats.fps; stats.t0 = now; stats.n = 0; }
}
function updateWaterLook() {
  const cl = P.clarity;
  const ab = GU.uAbsorb.value.set(0.45, 0.07, 0.035).divideScalar(cl);
  const sc = 0.04 / cl; GU.uScatter.value = sc;
  // in-scatter: ambient light inside the water times the single-scatter albedo (bluer scattering)
  const amb = tmpC.copy(hemi.color).multiplyScalar(hemi.intensity * 0.9).add(new C3().copy(GU.uSunColor.value).multiplyScalar(0.55 * Math.max(GU.uSunDir.value.y, 0)));
  const spec = [0.55, 0.85, 1.3];
  GU.uInscatter.value.setRGB(amb.r * sc * spec[0] / (ab.x + sc), amb.g * sc * spec[1] / (ab.y + sc), amb.b * sc * spec[2] / (ab.z + sc)).multiplyScalar(0.55);
  WU.uSkyAmb.value.copy(hemi.color).multiplyScalar(hemi.intensity * 0.55).lerp(ENV.fogCol, 0.3);
  WU.uSkyZen.value.setRGB(0.12, 0.28, 0.65).multiplyScalar(1 - ENV.night * 0.97).lerp(ENV.fogCol, ENV.overcast);
  WU.uSkyHor.value.copy(skyMat.uniforms.uHaze.value);
  WU.uFoamAmt.value = P.foam; WU.uBiolum.value = P.biolum; GU.uCaustInt.value = P.caustics;
}
function advance(sec, fps = 60) { const n = Math.round(sec * fps); for (let i = 0; i < n; i++) frameStep(1 / fps, i === n - 1); }
window.COVE = { skyMat, hemi, sun, compositeMat, STRUCT, dbgView, advance, frameStep, buildLog, profile, THREE, scene, camera, renderer, P, ENV, GU, WU, RT, setCam, stats, waterHeightAt, groundAt, maskSample, input };
document.getElementById('loader').style.opacity = 0;
setTimeout(() => document.getElementById('loader').remove(), 1000);
tick();
})();
